[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "higher-order-modular-attention"
version = "1.0.0"
description = "Higher-Order Modular Attention: attention modules and the code for the paper's experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
tape = ["scipy>=1.11", "lmdb>=1.4", "tqdm>=4.62"]
all = ["scipy>=1.11", "lmdb>=1.4", "tqdm>=4.62"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["models*", "tasks*", "data*", "training*", "evaluation*", "utils*"]

